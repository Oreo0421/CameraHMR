# @package _global_
#
# 混合训练: 自定义数据（如 5 个 subject）+ COCO（约 5:1，自定义为主）
# - 自定义 5 人: 先运行 prepare 的 --subjects 指定 5 个 ID，再训练
# - COCO: data/training-images/COCO/images/train2014/ 或 train2017/
# 用法: python train.py data=fzhi_custom_train experiment=camerahmr exp_name=xxx

GENERAL:
  TOTAL_STEPS: 60_000    # 混合训练 6 万步；要更长可改 100_000
  VAL_STEPS: 8000
  LOG_STEPS: 50

# 每次 val 只跑 25% 的 val 集，加快训练
trainer:
  limit_val_batches: 0.25

DATASETS:
  # 5× fzhi-custom + coco-train ≈ 自定义 80% + COCO 20%；要更多 COCO 可加 coco-train
  DATASETS_AND_RATIOS: 'fzhi-custom_fzhi-custom_fzhi-custom_fzhi-custom_coco-train'
  VAL_DATASETS: fzhi-custom-val
